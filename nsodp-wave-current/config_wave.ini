[main]
type = wave
dtype_config_file = nsodp-wave-current/data_types_wave.yaml
sensors_file= sensors.yaml
variables_file= variables.yaml
dataset_id_list = hrs3-qwwh
    7iig-p4yk
    d5r3-x2vi
    9gpk-gb2v
    3szy-egwz
    mzsa-kbqq
    sf72-xdbr
    gw4c-5af6
    x5q4-n7kq
    gi34-iea2
    9339-jb3s
dataset_columns = waterbody
    station
    latitude
    longitude
    sensor_model
    sensor_serial_number
    timestamp_utc
    sensor_depth_below_surface_m
dataset_sort_order = deployment_id, timestamp_utc
dataset_storage_type = joined_data
data_folder_name = nsodp-wave-current/

[metadata]
col_instrument_type = sensor_model
col_instrument_id = sensor_serial_number
col_latitude = latitude
col_longitude = longitude
col_depth = sensor_depth_below_surface_m
timeseries_variables=waterbody,station,deployment_id,sensor_model,sensor_serial_number

[reference]
reference_dataset_id = uban-q9i2
dtype_config_file = nsodp-wave-current/data_types_wave_deployment.yaml
join_key = deployment_id
dataset_columns = latitude
    longitude
    deployment_date
    retrieval_date
    sensor_model
    sensor_serial_number
    deployment_sounding_m
    wave_ensemble_interval_s
    wave_averaging_interval_s
    wave_pings_per_ensemble
dataset_sort_order = deployment_id